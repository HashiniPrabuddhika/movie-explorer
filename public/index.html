<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e11d48" />
    <meta
      name="description"
      content="Movie Explorer: discover trending films, search movies, view cast and trailers, and save your favorites."
    />
    <meta name="keywords" content="movies, TMDb, trending movies, movie search, trailers, favorites" />

    <!-- Social sharing preview -->
    <meta property="og:title" content="Movie Explorer" />
    <meta property="og:description" content="Discover trending films, view details and trailers, and save your favorites." />
    <meta property="og:type" content="website" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Poppins (brand font) + Roboto (fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@400;500&display=swap"
    />

    <!-- Faster image loading from TMDb -->
    <link rel="preconnect" href="https://image.tmdb.org" />

    <title>Movie Explorer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Movie Explorer.</noscript>
    <div id="root"></div>
  </body>
</html>
